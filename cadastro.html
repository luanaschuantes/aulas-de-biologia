<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>BioMentoria - Cadastro</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="cadastro.html">Matricule-se</a>
        <a href="planos.html">Planos</a>
        <a href="alunos.html">Alunos</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Formulário de Matrícula</h2>
            <form id="formCadastro">
                <label>Nome Completo:</label>
                <input type="text" id="nome" required>
                
                <label>E-mail:</label>
                <input type="email" id="email" required>
                
                <label>Objetivo:</label>
                <select id="objetivo">
                    <option value="ENEM">ENEM</option>
                    <option value="Vestibular">Vestibular</option>
                    <option value="Concurso">Concurso</option>
                    <option value="Reforço Escolar">Reforço Escolar</option>
                </select>

                <button type="submit">Finalizar Cadastro</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const aluno = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                objetivo: document.getElementById('objetivo').value,
                data: new Date().toLocaleDateString()
            };

            // Lógica de "Banco de Dados" (LocalStorage)
            let alunos = JSON.parse(localStorage.getItem('alunos')) || [];
            alunos.push(aluno);
            localStorage.setItem('alunos', JSON.stringify(alunos));

            alert('Cadastro realizado com sucesso! Bem-vindo(a) à BioMentoria.');
            window.location.href = 'alunos.html';
        });
    </script>
</body>
</html>
